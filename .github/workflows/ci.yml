name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  npm-wrapper-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No network/download here on purpose — that path was verified by
      # hand against a real release. This checks only the deterministic
      # platform-mapping logic, which is exactly what a CI run can do
      # without depending on GitHub Releases being reachable/rate-limited.
      - run: npm test
        working-directory: npm
